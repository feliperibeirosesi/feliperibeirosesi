
name: Atualizar Progresso do Curso
 
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
 
jobs:
  update-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
 
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Calcular e atualizar progresso
        run: python update_progress.py
 
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: atualiza progresso do curso"
          git push
